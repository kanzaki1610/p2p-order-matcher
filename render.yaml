services:
  - type: web
    name: p2p-order-matcher
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.shared:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: INGEST_API_KEY
        generateValue: true
      - key: SEPAY_WEBHOOK_SECRET
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: PUBLIC_BASE_URL
        value: "https://p2p-order-matcher.onrender.com"
      - key: DASHBOARD_ADMIN_KEY
        generateValue: true
      - key: OKX_BROWSER_BRIDGE_SECRET
        generateValue: true
      - key: OKX_API_KEY
        sync: false
      - key: OKX_API_SECRET
        sync: false
      - key: OKX_API_PASSPHRASE
        sync: false
      - key: BITGET_P2P_ENABLED
        value: "false"
      - key: BITGET_P2P_API_KEY
        sync: false
      - key: BITGET_P2P_API_SECRET
        sync: false
      - key: BITGET_P2P_API_PASSPHRASE
        sync: false
      - key: BITGET_P2P_BASE_URL
        value: "https://api.bitget.com"
      - key: BITGET_P2P_SYNC_SECONDS
        value: "30"
      - key: BITGET_P2P_AD_LIMIT
        value: "10"
      - key: BITGET_P2P_LIVE_WRITES
        value: "false"
      - key: MEXC_P2P_ENABLED
        value: "false"
      - key: MEXC_P2P_API_KEY
        sync: false
      - key: MEXC_P2P_API_SECRET
        sync: false
      - key: MEXC_P2P_BASE_URL
        value: "https://api.mexc.com"
      - key: MEXC_P2P_SYNC_SECONDS
        value: "10"
      - key: MEXC_P2P_ORDER_LIMIT
        value: "50"
      - key: MEXC_P2P_LOOKBACK_MINUTES
        value: "1440"
      - key: MEXC_P2P_INCOMING_SIDE
        value: "SELL"
      - key: MEXC_AUTO_RELEASE_ENABLED
        value: "false"
      - key: MEXC_P2P_LIVE_WRITES
        value: "false"
      - key: AUTO_MATCH_THRESHOLD
        value: "90"
      - key: REVIEW_THRESHOLD
        value: "60"

      - key: NOTIFICATION_PROVIDER
        value: "discord"
      - key: TELEGRAM_FALLBACK_ENABLED
        value: "true"
      - key: TELEGRAM_COMMANDS_ENABLED
        value: "true"
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: DISCORD_WEBHOOK_ORDERS
        sync: false
      - key: DISCORD_WEBHOOK_PAYMENT_DETECTED
        sync: false
      - key: DISCORD_WEBHOOK_REVIEW_REQUIRED
        sync: false
      - key: DISCORD_WEBHOOK_CONFIRMED
        sync: false
      - key: DISCORD_WEBHOOK_SYSTEM_ALERTS
        sync: false
      - key: DISCORD_COMMANDS_ENABLED
        value: "false"
      - key: DISCORD_APPLICATION_ID
        sync: false
      - key: DISCORD_PUBLIC_KEY
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      - key: DISCORD_ALLOWED_USER_IDS
        sync: false
      - key: DISCORD_ALLOWED_ROLE_IDS
        sync: false
      - key: DISCORD_COMMAND_CHANNEL_IDS
        sync: false

