services:
  - type: web
    name: p2p-order-matcher
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: INGEST_API_KEY
        generateValue: true
      - key: SEPAY_WEBHOOK_SECRET
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: PUBLIC_BASE_URL
        value: "https://p2p-order-matcher.onrender.com"
      - key: DASHBOARD_ADMIN_KEY
        generateValue: true
      - key: OKX_BROWSER_BRIDGE_SECRET
        generateValue: true
      - key: OKX_API_KEY
        sync: false
      - key: OKX_API_SECRET
        sync: false
      - key: OKX_API_PASSPHRASE
        sync: false
      - key: AUTO_MATCH_THRESHOLD
        value: "90"
      - key: REVIEW_THRESHOLD
        value: "60"
